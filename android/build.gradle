buildscript {
    ext {
        buildToolsVersion = "34.0.0"  // 使用已安装的34.0.0版本
        minSdkVersion = 24            // 提升到24以满足react-native-webrtc要求
        compileSdkVersion = 34        // 保持34
        targetSdkVersion = 34         // 保持34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.9.10"     // 升级到1.9.10以兼容react-native-vision-camera
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
    }
}

apply plugin: "com.facebook.react.rootproject"
